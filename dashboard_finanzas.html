<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Personales 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a38;
    --text: #f0f0f8;
    --muted: #6b6b85;
    --ingreso: #00e5a0;
    --gasto: #ff4d6d;
    --ahorro: #4d9fff;
    --accent: #c8ff00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    max-width: 430px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    padding-top: 8px;
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .header .subtitle {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .sync-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  /* Month selector */
  .month-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 20px;
    scrollbar-width: none;
  }

  .month-tabs::-webkit-scrollbar { display: none; }

  .month-tab {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .month-tab.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 500;
  }

  /* KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    position: relative;
    overflow: hidden;
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .kpi-card.ingreso::before { background: var(--ingreso); }
  .kpi-card.gasto::before { background: var(--gasto); }
  .kpi-card.ahorro::before { background: var(--ahorro); }
  .kpi-card.balance::before { background: var(--accent); }

  .kpi-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .kpi-value {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }

  .kpi-value.ingreso { color: var(--ingreso); }
  .kpi-value.gasto { color: var(--gasto); }
  .kpi-value.ahorro { color: var(--ahorro); }
  .kpi-value.balance { color: var(--accent); }

  .kpi-sub {
    font-size: 9px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Section */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Category bars */
  .cat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .cat-name {
    font-size: 11px;
    width: 100px;
    flex-shrink: 0;
    color: var(--text);
  }

  .cat-bar-wrap {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .cat-bar {
    height: 100%;
    background: var(--gasto);
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  .cat-amount {
    font-size: 11px;
    color: var(--gasto);
    width: 80px;
    text-align: right;
    flex-shrink: 0;
  }

  /* Transactions */
  .tx-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .tx-row:last-child { border-bottom: none; }

  .tx-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .tx-dot.ingreso { background: var(--ingreso); }
  .tx-dot.gasto { background: var(--gasto); }
  .tx-dot.ahorro { background: var(--ahorro); }

  .tx-info { flex: 1; }

  .tx-desc {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .tx-meta {
    font-size: 10px;
    color: var(--muted);
  }

  .tx-amount {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    text-align: right;
  }

  .tx-amount.ingreso { color: var(--ingreso); }
  .tx-amount.gasto { color: var(--gasto); }
  .tx-amount.ahorro { color: var(--ahorro); }

  /* Balance bar */
  .balance-visual {
    margin: 12px 0;
  }

  .balance-bar-wrap {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .balance-bar-inner {
    display: flex;
    height: 100%;
  }

  .balance-ingreso {
    background: var(--ingreso);
    transition: width 0.6s ease;
  }

  .balance-gasto {
    background: var(--gasto);
    transition: width 0.6s ease;
  }

  .balance-ahorro {
    background: var(--ahorro);
    transition: width 0.6s ease;
  }

  .balance-legend {
    display: flex;
    gap: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
  }

  .legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .loading { animation: pulse 1.5s ease infinite; }

  /* Cuotas TC */
  .cuota-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .cuota-row:last-child { border-bottom: none; }

  .cuota-desc { font-size: 12px; color: var(--text); margin-bottom: 2px; }
  .cuota-meta { font-size: 10px; color: var(--muted); }
  .cuota-amount { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--gasto); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Finanzas<br>Personales 2026</h1>
    <div class="subtitle" id="lastUpdate">Cargando...</div>
  </div>
  <button class="sync-btn" onclick="loadData()">↻ SYNC</button>
</div>

<!-- Month tabs -->
<div class="month-tabs" id="monthTabs">
  <button class="month-tab" onclick="selectMonth('ENERO')">Ene</button>
  <button class="month-tab" onclick="selectMonth('FEBRERO')">Feb</button>
  <button class="month-tab" onclick="selectMonth('MARZO')">Mar</button>
  <button class="month-tab" onclick="selectMonth('ABRIL')">Abr</button>
  <button class="month-tab" onclick="selectMonth('MAYO')">May</button>
  <button class="month-tab" onclick="selectMonth('JUNIO')">Jun</button>
  <button class="month-tab" onclick="selectMonth('JULIO')">Jul</button>
  <button class="month-tab" onclick="selectMonth('AGOSTO')">Ago</button>
  <button class="month-tab" onclick="selectMonth('SEPTIEMBRE')">Sep</button>
  <button class="month-tab" onclick="selectMonth('OCTUBRE')">Oct</button>
  <button class="month-tab" onclick="selectMonth('NOVIEMBRE')">Nov</button>
  <button class="month-tab" onclick="selectMonth('DICIEMBRE')">Dic</button>
</div>

<!-- KPI Cards -->
<div class="kpi-grid">
  <div class="kpi-card ingreso">
    <div class="kpi-label">Ingresos</div>
    <div class="kpi-value ingreso" id="kpiIngreso">$0</div>
    <div class="kpi-sub" id="kpiIngresoCount">0 transacciones</div>
  </div>
  <div class="kpi-card gasto">
    <div class="kpi-label">Gastos</div>
    <div class="kpi-value gasto" id="kpiGasto">$0</div>
    <div class="kpi-sub" id="kpiGastoCount">0 transacciones</div>
  </div>
  <div class="kpi-card ahorro">
    <div class="kpi-label">Ahorros</div>
    <div class="kpi-value ahorro" id="kpiAhorro">$0</div>
    <div class="kpi-sub" id="kpiAhorroCount">0 transacciones</div>
  </div>
  <div class="kpi-card balance">
    <div class="kpi-label">Balance</div>
    <div class="kpi-value balance" id="kpiBalance">$0</div>
    <div class="kpi-sub" id="kpiBalanceSub">—</div>
  </div>
</div>

<!-- Balance visual -->
<div class="section">
  <div class="section-title">Distribución del mes</div>
  <div class="balance-visual">
    <div class="balance-bar-wrap">
      <div class="balance-bar-inner">
        <div class="balance-ingreso" id="barIngreso" style="width:0%"></div>
        <div class="balance-gasto" id="barGasto" style="width:0%"></div>
        <div class="balance-ahorro" id="barAhorro" style="width:0%"></div>
      </div>
    </div>
    <div class="balance-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--ingreso)"></div>Ingresos</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--gasto)"></div>Gastos</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--ahorro)"></div>Ahorros</div>
    </div>
  </div>
</div>

<!-- Gastos por categoría -->
<div class="section">
  <div class="section-title">Gastos por categoría</div>
  <div id="categoryList"><div class="loading">CARGANDO...</div></div>
</div>

<!-- Últimas transacciones -->
<div class="section">
  <div class="section-title">Últimas transacciones</div>
  <div id="txList"><div class="loading">CARGANDO...</div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCT3Tq83IfKQvYUbotp71As1xPWNTxGclwCOnqD7_s4PBDQsLiOnkk-7FnKZh6gua9/exec';

const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

let currentMonth = '';
let allData = {};

function getCurrentMonth() {
  const now = new Date();
  return MESES[now.getMonth()];
}

function formatCOP(amount) {
  const abs = Math.abs(amount);
  if (abs >= 1000000) return '$' + (abs/1000000).toFixed(1) + 'M';
  if (abs >= 1000) return '$' + Math.round(abs/1000) + 'k';
  return '$' + Math.round(abs).toLocaleString('es-CO');
}

function selectMonth(month) {
  currentMonth = month;
  
  // Update tabs
  document.querySelectorAll('.month-tab').forEach((tab, i) => {
    tab.classList.toggle('active', MESES[i] === month);
  });
  
  renderDashboard();
}

async function fetchSheet(sheetName) {
  const url = `${SCRIPT_URL}?mes=${encodeURIComponent(sheetName)}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (Array.isArray(data)) return data;
    return [];
  } catch(e) {
    return [];
  }
}

async function loadData() {
  document.getElementById('lastUpdate').textContent = 'Sincronizando...';
  
  // Load all months
  for (const mes of MESES) {
    const data = await fetchSheet(mes);
    allData[mes] = parseJSON(data);
  }
  
  const now = new Date();
  document.getElementById('lastUpdate').textContent = 
    'Actualizado: ' + now.toLocaleDateString('es-CO', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  
  renderDashboard();
}

function parseJSON(data) {
  if (!data || !Array.isArray(data)) return [];
  return data.map(row => ({
    fecha: row['FECHA'] || '',
    monto: parseFloat((row['MONTO'] || '0').toString().replace(/[^0-9.-]/g, '')) || 0,
    tipo: (row['TIPO'] || '').toUpperCase(),
    categoria: row['CATEGORIA'] || '',
    descripcion: row['DESCRIPCION'] || '',
    metodo: row['METODO'] || ''
  })).filter(r => r.fecha);
}

function renderDashboard() {
  const data = allData[currentMonth] || [];
  
  const ingresos = data.filter(r => r.tipo === 'INGRESO');
  const gastos = data.filter(r => r.tipo === 'GASTO');
  const ahorros = data.filter(r => r.tipo === 'AHORRO');
  
  const totalIngreso = ingresos.reduce((s, r) => s + Math.abs(r.monto), 0);
  const totalGasto = gastos.reduce((s, r) => s + Math.abs(r.monto), 0);
  const totalAhorro = ahorros.reduce((s, r) => s + Math.abs(r.monto), 0);
  const balance = totalIngreso - totalGasto - totalAhorro;
  
  // KPIs
  document.getElementById('kpiIngreso').textContent = formatCOP(totalIngreso);
  document.getElementById('kpiGasto').textContent = formatCOP(totalGasto);
  document.getElementById('kpiAhorro').textContent = formatCOP(totalAhorro);
  document.getElementById('kpiBalance').textContent = formatCOP(balance);
  document.getElementById('kpiIngresoCount').textContent = ingresos.length + ' transacciones';
  document.getElementById('kpiGastoCount').textContent = gastos.length + ' transacciones';
  document.getElementById('kpiAhorroCount').textContent = ahorros.length + ' transacciones';
  document.getElementById('kpiBalanceSub').textContent = balance >= 0 ? '✓ Positivo' : '⚠ Negativo';

  // Balance bar
  const total = totalIngreso + totalGasto + totalAhorro || 1;
  document.getElementById('barIngreso').style.width = (totalIngreso/total*100) + '%';
  document.getElementById('barGasto').style.width = (totalGasto/total*100) + '%';
  document.getElementById('barAhorro').style.width = (totalAhorro/total*100) + '%';

  // Categories
  const cats = {};
  gastos.forEach(r => {
    const cat = r.categoria || 'Sin categoría';
    cats[cat] = (cats[cat] || 0) + Math.abs(r.monto);
  });
  
  const sortedCats = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  const maxCat = sortedCats[0]?.[1] || 1;
  
  const catList = document.getElementById('categoryList');
  if (sortedCats.length === 0) {
    catList.innerHTML = '<div class="empty">Sin gastos este mes</div>';
  } else {
    catList.innerHTML = sortedCats.map(([cat, amt]) => `
      <div class="cat-row">
        <div class="cat-name">${cat}</div>
        <div class="cat-bar-wrap">
          <div class="cat-bar" style="width:${amt/maxCat*100}%"></div>
        </div>
        <div class="cat-amount">${formatCOP(amt)}</div>
      </div>
    `).join('');
  }

  // Transactions (last 10)
  const sorted = [...data].sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 10);
  const txList = document.getElementById('txList');
  
  if (sorted.length === 0) {
    txList.innerHTML = '<div class="empty">Sin transacciones este mes</div>';
  } else {
    txList.innerHTML = sorted.map(r => {
      const tipo = r.tipo.toLowerCase();
      const prefix = r.tipo === 'GASTO' ? '-' : '+';
      return `
        <div class="tx-row">
          <div class="tx-dot ${tipo}"></div>
          <div class="tx-info">
            <div class="tx-desc">${r.descripcion || r.categoria || '—'}</div>
            <div class="tx-meta">${r.categoria} · ${r.metodo}</div>
          </div>
          <div class="tx-amount ${tipo}">${prefix}${formatCOP(r.monto)}</div>
        </div>
      `;
    }).join('');
  }
}

// Init
window.onload = () => {
  const mes = getCurrentMonth();
  selectMonth(mes);
  loadData();
};
</script>

</body>
</html>
